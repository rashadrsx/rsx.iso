services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 13378:80
    volumes:
      # CHANGE THESE PATHS to your actual folders
      - /home/rashad/Music/books:/audiobooks
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=Africa/Cairo
    user: "1000:1000" # Use your UID/GID (check with 'id' command)
    restart: unless-stopped
