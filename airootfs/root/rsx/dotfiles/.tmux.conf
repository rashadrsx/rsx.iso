set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar: fully transparent ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 50

# --- Session pill (right) ---
set -g status-right "#[fg=#3b82f6,bg=default]#[fg=white,bg=#3b82f6,bold] #S #[fg=#3b82f6,bg=default]"

# --- Window tabs (left) ---
setw -g window-status-separator " "
setw -g window-status-style "bg=default,fg=white"

# Inactive: dark navy pill, dim text
setw -g window-status-format "#[fg=#1e293b,bg=default]#[fg=#64748b,bg=#1e293b] #I #W #[fg=#1e293b,bg=default]"

# Active: bright blue pill, dark bold text
setw -g window-status-current-format "#[fg=#3b82f6,bg=default]#[fg=#ffffff,bg=#3b82f6,bold] #I #W #[fg=#3b82f6,bg=default]"
