command=/usr/lib/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none

[brightness]
label=☀️
command=~/.config/i3/brightness
interval=1

[volume]
label=VOL
command=~/.config/i3/volume
interval=1

[layout]
label=⌨️ 
command=~/.config/i3/layout
interval=1

[time]
label=🕒
command=date '+%d %m %Y %I:%M %p'
interval=1

[music]
command=~/.config/i3/music
interval=1

# [pomodoro]
# command=~/.config/i3/pomodoro
# interval=1

[power_profile]
command=~/.config/i3/power_profile
interval=1

[battery]
command=cat /sys/class/power_supply/BAT0/capacity
interval=1
